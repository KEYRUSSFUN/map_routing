# Масштабирование API (2+ инстанса) + nginx перед ними.
#
# Требует Docker Compose v2.24+ (для !reset) или уберите ports у api вручную.
#
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d --build --scale api=2
#
# Клиенты ходят на http://localhost:5000 → nginx → api (sticky ip_hash для WebSocket).

services:
  api:
    ports: !reset []

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "5000:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped
